<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Exam - COE</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Reusing Sidebar for now (should be a partial) -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>COE Panel</h2>
                <p>{{ user.name }}</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/coe/dashboard">Dashboard</a></li>
                <li class="active"><a href="/coe/schedule-exam">Create Exam Schedule</a></li>
                <li><a href="/coe/view-schedules">View Schedules</a></li>
                <li><a href="/coe/authorize-halltickets">Authorize Hall Tickets</a></li>
                <li><a href="/coe/manage-attendance">Manage Attendance</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="dashboard-header">
                <h1>Create Exam Schedule</h1>
            </header>

            <div class="content-card">
                <form action="/coe/schedule-exam" method="POST" class="exam-form">
                    <div class="form-group">
                        <label>Year</label>
                        <select name="year" required>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Semester</label>
                        <select name="semester" required>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Exam Type</label>
                        <select name="exam_type" required>
                            <option value="INTERNAL">Internal Exam</option>
                            <option value="SEMESTER">Semester Exam</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" name="start_date" required>
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" name="end_date" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Generate Schedule</button>
                </form>

                {% if message %}
                <div class="alert {{ 'alert-success' if success else 'alert-error' }}">
                    {{ message }}
                </div>
                {% endif %}
            </div>
        </main>
    </div>
</body>

</html>
